services:
  # ========== BACKEND API (Python FastAPI) ==========
  - type: web
    name: polynous-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Python Version ───────────────────────────────
      - key: PYTHON_VERSION
        value: 3.11.0

      # ── Database ──────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: polynous-db
          property: connectionString

      # ── AI / LLM ─────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

      # ── Knowledge Graph / Vectors / Memory / Search ──
      # Everything runs on Postgres (pgvector). Neo4j + Pinecone are removed.
      - key: GRAPH_BACKEND
        value: postgres

      # ── Auth & Security ───────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # ── CORS ──────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://polynous-frontend.onrender.com

      # ── OAuth (optional) ──────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://polynous-frontend.onrender.com/auth/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://polynous-frontend.onrender.com/auth/callback

      # ── Rate Limiting ─────────────────────────────────
      - key: RATE_LIMIT_FREE
        value: "20"
      - key: RATE_LIMIT_PRO
        value: "100"

      # ── Logging ───────────────────────────────────────
      - key: LOG_LEVEL
        value: info

  # ========== FRONTEND (React + Vite) ==========
  - type: web
    name: polynous-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://polynous-api.onrender.com
      - key: VITE_APP_NAME
        value: POLYNOUS
      - key: VITE_APP_VERSION
        value: "3.0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # ========== POSTGRESQL DATABASE ==========
  - type: pserv
    name: polynous-db
    env: docker
    plan: free
    region: oregon
    image:
      url: docker.io/library/postgres:16
    envVars:
      - key: POSTGRES_DB
        value: polynous
      - key: POSTGRES_USER
        value: polynous_user
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1